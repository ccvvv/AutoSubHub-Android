name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify packaged ARM64 execution probe
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libruntime_probe.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h app/src/main/jniLibs/arm64-v8a/libruntime_probe.so | grep -E "Class:|Machine:|Type:"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libruntime_probe.so"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubHub-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
