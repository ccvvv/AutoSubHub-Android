name: Android CI

# Trigger a fresh build for the latest SSH upload diagnostics.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: autosubhub-android-debug-signing-v1

      - name: Verify restored signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED="07062FFABE3976EC344B3E316293DFD774F9A4D76BBEC0B68ACC51AE7D9AA3CF"
          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signing-certificate.txt
          APK_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' apk-signing-certificate.txt | tr -d ':')"
          EXPECTED="07062FFABE3976EC344B3E316293DFD774F9A4D76BBEC0B68ACC51AE7D9AA3CF"
          echo "Expected APK certificate SHA-256: $EXPECTED"
          echo "Actual APK certificate SHA-256:   $APK_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$EXPECTED"

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AutoSubHub-Android-NewApp-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubHub-Android-NewApp-debug
          path: app/build/outputs/apk/debug/AutoSubHub-Android-NewApp-debug.apk
          if-no-files-found: error
