name: Android CI

# Trigger a fresh build for the latest SSH upload diagnostics.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: autosubhub-android-debug-signing-v1

      - name: Verify restored signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee signing-certificate.txt
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED="7F6042B90FC92184190557CBC66BC6030D3BA3B80BF058B695017AB94D9A7619"
          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AutoSubHub-Android-NewApp-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubHub-Android-NewApp-debug
          path: app/build/outputs/apk/debug/AutoSubHub-Android-NewApp-debug.apk
          if-no-files-found: error
