name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example newapp-v0.1.1"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^newapp-v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid tag. Expected newapp-vX.Y.Z, optionally with a suffix."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: autosubhub-android-debug-signing-v1

      - name: Verify restored signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':')"
          EXPECTED="07062FFABE3976EC344B3E316293DFD774F9A4D76BBEC0B68ACC51AE7D9AA3CF"
          echo "Expected certificate SHA-256: $EXPECTED"
          echo "Actual certificate SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Sign APK with stable key
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/debug/app-debug-stable.apk \
            app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug-stable.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signing-certificate.txt
          APK_CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' apk-signing-certificate.txt | tr -d ':')"
          APK_CERT="$(printf '%s' "$APK_CERT" | tr '[:lower:]' '[:upper:]')"
          EXPECTED="07062FFABE3976EC344B3E316293DFD774F9A4D76BBEC0B68ACC51AE7D9AA3CF"
          echo "Expected APK certificate SHA-256: $EXPECTED"
          echo "Actual APK certificate SHA-256:   $APK_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$EXPECTED"

      - name: Prepare APK and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/AutoSubHub-NewApp.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with direct APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release/tag $TAG_NAME already exists; refusing to overwrite it."
            exit 1
          fi
          ARGS=(release create "$TAG_NAME" "${{ steps.package.outputs.apk_path }}" "${{ steps.package.outputs.apk_path }}.sha256"
            --title "$TAG_NAME"
            --notes "AutoSubHub NewApp APK built from main at commit $GITHUB_SHA. Unit tests and stable signing-certificate verification passed."
            --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
